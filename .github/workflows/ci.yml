name: CI / Release & Docker

on:
  push:
    tags:
      - "v*"
      - "[0-9]+.*"
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag_name:
        description: "发布版本号 (如 v1.0.0)"
        required: false
        default: ""

permissions:
  contents: write
  packages: write

jobs:
  build-binaries:
    name: Build Cross-Platform Binaries
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - os: linux
            arch: amd64
            suffix: ""
            archive: tar.gz
          - os: linux
            arch: arm64
            suffix: ""
            archive: tar.gz
          - os: windows
            arch: amd64
            suffix: .exe
            archive: zip
          - os: windows
            arch: arm64
            suffix: .exe
            archive: zip

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true

      - name: Get Release Version
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.tag_name }}" ]; then
            VERSION="${{ github.event.inputs.tag_name }}"
          elif [ -n "${{ github.ref_name }}" ]; then
            VERSION="${{ github.ref_name }}"
          else
            VERSION="v0.1.0"
          fi
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
          echo "BUILD_TIME=$(date -u +%Y-%m-%d)" >> $GITHUB_OUTPUT

      - name: Build Binary
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: 0
        run: |
          BIN_NAME="storeluna-gogo${{ matrix.suffix }}"
          go build -trimpath \
            -ldflags="-s -w -X main.Version=${{ steps.vars.outputs.VERSION }} -X main.BuildTime=${{ steps.vars.outputs.BUILD_TIME }}" \
            -o "bin/${BIN_NAME}" \
            ./cmd/storeluna-gogo

      - name: Package Artifact
        run: |
          DIST_NAME="storeluna-gogo-${{ steps.vars.outputs.VERSION }}-${{ matrix.os }}-${{ matrix.arch }}"
          mkdir -p dist
          cp config.example.yaml bin/
          if [ "${{ matrix.archive }}" = "zip" ]; then
            cd bin && zip -9 "../dist/${DIST_NAME}.zip" "storeluna-gogo${{ matrix.suffix }}" config.example.yaml && cd ..
          else
            cd bin && tar -czvf "../dist/${DIST_NAME}.tar.gz" "storeluna-gogo${{ matrix.suffix }}" config.example.yaml && cd ..
          fi
          cd dist && sha256sum * > "${DIST_NAME}.sha256" && cd ..

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*

  publish-release:
    name: Publish GitHub Release
    needs: build-binaries
    if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.tag_name != ''
    runs-on: ubuntu-latest
    steps:
      - name: Determine Tag Version
        id: tag_version
        run: |
          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="v0.1.0"
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-dist
          merge-multiple: true

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag_version.outputs.tag }}
          name: "Release ${{ steps.tag_version.outputs.tag }}"
          files: all-dist/*
          draft: false
          prerelease: false
          generate_release_notes: true

  docker-build:
    name: Build & Push Multi-Arch Docker Image
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check DockerHub Credentials
        id: check_docker
        run: |
          if [ -n "${{ secrets.DOCKERHUB_USERNAME }}" ] && [ -n "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            echo "has_creds=true" >> $GITHUB_OUTPUT
          else
            echo "has_creds=false" >> $GITHUB_OUTPUT
            echo "未配置 DOCKERHUB_USERNAME 或 DOCKERHUB_TOKEN，跳过 DockerHub 推送。"
          fi

      - name: Set up QEMU
        if: steps.check_docker.outputs.has_creds == 'true'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: steps.check_docker.outputs.has_creds == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: steps.check_docker.outputs.has_creds == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        if: steps.check_docker.outputs.has_creds == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ secrets.DOCKERHUB_USERNAME }}/storeluna-gogo
          tags: |
            type=raw,value=latest
            type=ref,event=tag

      - name: Build and Push Docker Image
        if: steps.check_docker.outputs.has_creds == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
